<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#241039">
<title>FLR Owners Panel</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap');

*{box-sizing:border-box}
body{margin:0;background:#f4f1f7;color:#281a35;font-family:'DM Sans',sans-serif}
button,input,select,textarea{font:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 80% 0,#512471,#1b0d2a 65%)}
.loginbox{background:white;width:min(420px,100%);padding:35px;border-radius:16px;box-shadow:0 20px 70px #0005}
.logo{width:48px;height:48px;border-radius:13px;background:#532778;color:white;display:grid;place-items:center;font-size:23px}
.eyebrow{font-size:9px;letter-spacing:2px;color:#9865ba;font-weight:800}
.login h1{font:900 39px 'Barlow Condensed';margin:8px 0}
.login p{font-size:12px;color:#887b93}
.login label,.form label{display:grid;gap:7px;margin:14px 0;font-size:11px;font-weight:700;color:#614d70}
.login input,.form input,.form select,.form textarea{width:100%;border:1px solid #ded4e6;border-radius:7px;padding:12px;background:white;color:#281a35}
.btn{border:0;border-radius:7px;background:#542578;color:white;padding:12px 16px;font-size:11px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:disabled{opacity:.6}
.login .btn{width:100%;justify-content:center;margin:12px 0}
.login small{display:block;text-align:center;color:#968a9f;font-size:9px}
.error{background:#fff0f0;color:#a32d37;padding:10px;border-radius:7px;font-size:11px;margin:10px 0}
.success{background:#e8f7ed;color:#277b49;padding:10px;border-radius:7px;font-size:11px;margin:10px 0}
.shell{display:flex;min-height:100vh}
.side{width:230px;background:#1d102b;color:white;padding:22px 15px;display:flex;flex-direction:column;flex:none}
.brand{padding:5px 10px 35px;font:900 25px 'Barlow Condensed';letter-spacing:2px}
.brand small{display:block;font:700 8px 'DM Sans';color:#bda9cd;letter-spacing:1.5px}
.side button{border:0;background:none;color:#c9bad5;padding:13px;border-radius:8px;text-align:left;cursor:pointer;font-weight:700;font-size:12px}
.side button.active,.side button:hover{background:#ffffff18;color:white}
.logout{margin-top:auto!important;background:#ffffff12!important}
.main{padding:0 32px 45px;max-width:1500px;width:100%;min-width:0}
.top{height:90px;border-bottom:1px solid #e4dce9;display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}
.top h2{font:800 30px 'Barlow Condensed';margin:4px 0}
.muted{font-size:10px;color:#91839a}
.panel{background:white;border:1px solid #e8e1ed;border-radius:12px;padding:22px;margin-bottom:18px}
.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.panel h3{font:800 26px 'Barlow Condensed';margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}
.stat{background:white;border:1px solid #e9e2ef;border-radius:10px;padding:17px}
.stat span{display:block;color:#92859c;font-size:10px}
.stat b{font:800 30px 'Barlow Condensed'}
.welcome{padding:28px;background:linear-gradient(110deg,#32134e,#63328a);border-radius:13px;color:white}
.welcome h1{font:900 44px 'Barlow Condensed';margin:10px 0}
.welcome p{font-size:12px;color:#dfd0e9}
.rows{display:grid}
.row{display:grid;grid-template-columns:115px 1fr 90px 80px;gap:12px;align-items:center;padding:13px 0;border-top:1px solid #eee9f2;font-size:11px}
.row small{display:block;color:#96899f;margin-top:4px}
.pill{font-size:9px;text-transform:uppercase;background:#f1eafa;color:#6c3c90;border-radius:20px;padding:6px 8px;justify-self:start}
.pill.completed{background:#e7f6ec;color:#287b49}
.actions{display:flex;gap:5px}
.iconbtn{border:0;background:#f2edf6;color:#63417e;border-radius:6px;padding:8px;cursor:pointer}
.teamrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #eee8f2;border-radius:9px;margin:8px 0}
.teamrow img{width:40px;height:40px;object-fit:contain}
.teamrow div{flex:1}
.teamrow b{font-size:12px}
.teamrow small{display:block;color:#96899f;font-size:10px}
.form label{margin:12px 0}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.modalbg{position:fixed;inset:0;background:#13091fa8;display:grid;place-items:center;padding:20px;z-index:10}
.modal{background:white;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:24px}
.modalhead{display:flex;justify-content:space-between;align-items:center}
.modalhead h3{font:800 29px 'Barlow Condensed'}
.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.secondary{background:white;color:#5b3975;border:1px solid #ded4e6}
.empty{padding:30px;text-align:center;background:#faf8fc;color:#91849a;border-radius:8px;font-size:12px}
.preview{max-width:90px;max-height:90px;object-fit:contain}

@media(max-width:760px){
.shell{display:block}
.side{width:100%;flex-direction:row;align-items:center;overflow:auto;padding:8px;gap:3px}
.brand{padding:0 8px;font-size:20px}
.brand small{display:none}
.side button{font-size:10px;padding:10px}
.logout{margin:0!important}
.main{padding:0 13px 30px}
.stats{grid-template-columns:repeat(2,1fr)}
.row{grid-template-columns:72px 1fr 65px;gap:6px}
.row .pill{display:none}
.actions{grid-column:3}
.formgrid{grid-template-columns:1fr}
.panel{padding:15px}
.panelhead{gap:8px}
.welcome h1{font-size:37px}
}

#flr-language-screen{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 80% 0,#542477,#170c24 70%);font-family:'DM Sans',sans-serif;color:#fff}
.flr-language-card{width:min(430px,100%);padding:32px 25px;border:1px solid #ffffff35;border-radius:18px;background:#241432;text-align:center;box-shadow:0 24px 80px #0008}
.flr-language-title{font-size:27px;font-weight:900;letter-spacing:.4px}
.flr-language-card p{color:#cbbbd7;font-size:13px;line-height:1.6;margin:10px 0 24px}
.flr-language-card button{display:block;width:100%;margin:10px 0;padding:15px;border:1px solid #ffffff30;border-radius:9px;background:#ffffff12;color:white;font-size:16px;font-weight:800;cursor:pointer}
.flr-language-card button:hover{background:#6d35a0}

:where(button,.btn,.match,.team,.stat,.panel,.teamrow,.row,.loginbox,.card){
transition:transform .22s ease,box-shadow .22s ease,background-color .22s ease,border-color .22s ease,opacity .22s ease;
}
:where(button,.btn):hover{transform:translateY(-2px);box-shadow:0 8px 22px #160b2424}
:where(.match,.team,.stat,.panel,.teamrow,.row):hover{transform:translateY(-3px);box-shadow:0 12px 28px #160b2420}
:where(button,.btn):active{transform:translateY(0) scale(.98)}
:where(button,.btn,input,select,textarea):focus-visible{outline:2px solid #a875d5;outline-offset:3px}
html{scroll-behavior:smooth}
@keyframes flrFadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
#app>.content,#app>.hero,#root .panel,#root .welcome{animation:flrFadeUp .38s ease both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

function flrTranslateText(s){
if(flrLang!=='fr')return s;
const trimmed=s.trim();
if(Object.prototype.hasOwnProperty.call(FLR_TRANSLATIONS,trimmed))
return s.replace(trimmed,FLR_TRANSLATIONS[trimmed]);
let result=s;
const phrases=Object.keys(FLR_TRANSLATIONS).sort((a,b)=>b.length-a.length);
for(const en of phrases){
if(en.length>2&&result.includes(en))
result=result.split(en).join(FLR_TRANSLATIONS[en]);
}
result=result.replace(/\b(Home|Matches|Match|Results|Standings|Teams|Team|News|Dashboard|Settings|Upcoming|Completed|Postponed|Cancelled|Edit|Delete|Cancel|Season|Venue|Status|Save|Create|Add|All|Week|Date|Time|Email|Password|Description|Club|Search|Filter)\b/g,w=>FLR_WORDS[w]||w);
return result;
}

function flrTranslateTree(node=document.body){
if(flrLang!=='fr')return;
const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);
let n;
while(n=walker.nextNode()){
if(n.nodeValue.trim())n.nodeValue=flrTranslateText(n.nodeValue);
}
node.querySelectorAll?.('input[placeholder],textarea[placeholder],img[alt],button[aria-label],select option').forEach(el=>{
for(const a of ['placeholder','alt','aria-label'])
if(el.getAttribute(a))el.setAttribute(a,flrTranslateText(el.getAttribute(a)));
if(el.tagName==='OPTION')el.textContent=flrTranslateText(el.textContent);
});
}

function flrChooseLanguage(lang){
flrLang=lang;
document.documentElement.lang=lang;
document.getElementById('flr-language-screen')?.remove();
flrTranslateTree();
}

document.body.appendChild(d);
}

const flrObserver=new MutationObserver(records=>{
if(flrLang==='fr')
for(const r of records)
for(const n of r.addedNodes)
if(n.nodeType===1||n.nodeType===3){
if(n.nodeType===3)n.nodeValue=flrTranslateText(n.nodeValue);
else flrTranslateTree(n);
}
});
flrObserver.observe(document.body,{childList:true,subtree:true});

function esc(s){
return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function msg(s,err=false){
let el=document.getElementById('msg');
if(el){el.className=err?'error':'success';el.textContent=s;}
}

async function load(){
if(!db)return;
let [t,m,s,pl]=await Promise.all([
db.from('teams').select('*').order('name'),
db.from('matches').select('*').order('match_date').order('kick_off'),
db.from('league_settings').select('*').eq('id',1).maybeSingle(),
db.from('players').select('*').order('name')
]);
if(t.error||m.error||s.error||pl.error){
msg(t.error?.message||m.error?.message||s.error?.message||pl.error?.message,true);
return;
}
teams=t.data||[];
matches=m.data||[];
players=pl.data||[];
settings=s.data||{};
render();
}

async function checkSession(){
if(!db){
renderLogin('Add your Supabase URL and anon key in this HTML file first.');
return;
}
let {data}=await db.auth.getSession();
session=data.session;
if(session)await checkRole();
else renderLogin();

db.auth.onAuthStateChange(async(_e,s)=>{
session=s;
if(s)await checkRole();
else{
role=null;
renderLogin();
}
});
}

async function checkRole(){
let {data,error}=await db.from('user_roles')
.select('role')
.eq('user_id',session.user.id)
.maybeSingle();

if(error||!data){
await db.auth.signOut();
renderLogin('This account is not authorised for the FLR Owners Panel.');
return;
}
role=data.role;
await load();
}

<div><span class="eyebrow">FLR / MANAGEMENT</span><h2>${tab}</h2></div>

${tab==='Dashboard'?`
<div class="welcome">
<span class="eyebrow">SEASON ${esc(settings.season||'')}</span>
<h1>Welcome back to FLR.</h1>

${[['Teams',teams.length],['Players',players.length],['Total matches',matches.length],['Upcoming',up],['Completed',done],['Postponed',post]].map(x=>`

</div>
${players.map(p=>`

${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:'⚽'}
<div>
<b>${esc(p.name)}</b>
<small>${esc(team(p.team_id)?.name||'No team')} · ${esc(p.position||'Player')} · ${Number(p.goals||0)} goals</small>

<button class="iconbtn" onclick="deletePlayer('${p.id}')">Delete</button>

`:tab==='Teams'?`
<div class="panel">
<div class="panelhead">
<div><span class="eyebrow">CLUB DIRECTORY</span><h3>Manage teams</h3></div>
<button class="btn" onclick="openTeam()">＋ Add team</button>
</div>
${teams.map(t=>`
<div class="teamrow">
${t.logo_url?`<img src="${t.logo_url}">`:'⚽'}
<div><b>${esc(t.name)}</b><small>${esc(t.description||'FLR club')}</small></div>
<button class="iconbtn" onclick="openTeam('${t.id}')">Edit</button>
<button class="iconbtn" onclick="deleteTeam('${t.id}')">Delete</button>
</div>`).join('')||'<div class="empty">No teams yet. Add your first FLR club.</div>'}

`:`
<form class="panel form" onsubmit="saveSettings(event)">
<div class="panelhead">
<div><span class="eyebrow">IDENTITY & BRANDING</span><h3>League settings</h3></div>
<button class="btn">Save changes</button>
</div>
<label>League name<input id="sname" value="${esc(settings.league_name||'Federal League Roblox')}"></label>
<label>Season<input id="season" value="${esc(settings.season||'2026/27')}"></label>
<label>Homepage announcement<textarea id="announcement" rows="3">${esc(settings.announcement||'')}</textarea></label>
<label>Primary colour<input id="primary" type="color" value="${esc(settings.primary_color||'#35105f')}"></label>
<label>Secondary colour<input id="secondary" type="color" value="${esc(settings.secondary_color||'#6d28a8')}"></label>

</main>

function rows(arr,actions=false){
return `<div class="rows">
${arr.map(m=>`
<div class="row">
<div>MW ${m.matchweek}<small>${esc(m.match_date)} · ${esc((m.kick_off||'').slice(0,5))}</small></div>
<div><b>${esc(team(m.home_team_id)?.name||'Home')}</b> &nbsp; ${m.status==='completed'?`${m.home_score} - ${m.away_score}`:'vs'} &nbsp; <b>${esc(team(m.away_team_id)?.name||'Away')}</b></div>
<span class="pill ${m.status}">${m.status}</span>
<div class="actions">
<button class="iconbtn" onclick="openMatch('${m.id}')">Edit</button>
${actions?`<button class="iconbtn" onclick="deleteMatch('${m.id}')">×</button>`:''}
</div>
</div>`).join('')||'<div class="empty">No matches created yet.</div>'}
</div>`;
}

function openMatch(id=''){
editing=id?matches.find(m=>m.id===id):null;
modal='match';
render();
}

function openTeam(id=''){
editing=id?team(id):null;
modal='team';
render();
}

function openPlayer(id=''){
editing=id?players.find(p=>p.id===id):null;
modal='player';
render();
}

async function savePlayer(e){
e.preventDefault();
const p={
name:document.getElementById('pname').value.trim(),
team_id:document.getElementById('pteam').value||null,
position:document.getElementById('pposition').value.trim(),
shirt_number:Number(document.getElementById('pnumber').value||0),
avatar_url:document.getElementById('pavatar').value.trim()||null,
goals:Number(document.getElementById('pgoals').value||0),
assists:Number(document.getElementById('passists').value||0),
yellow_cards:Number(document.getElementById('pyellow').value||0),
red_cards:Number(document.getElementById('pred').value||0),
clean_sheets:Number(document.getElementById('pclean').value||0)
};
try{
let q=editing?db.from('players').update(p).eq('id',editing.id):db.from('players').insert(p);
let {error}=await q;
if(error)throw error;
modal='';
await load();
msg('Player saved.');
}catch(err){alert(err.message)}
}

async function deletePlayer(id){
if(!confirm('Delete this player?'))return;
const {error}=await db.from('players').delete().eq('id',id);
if(error)alert(error.message);
else load();
}

function modalHtml(){
if(modal==='player'){
let p=editing||{};
return `<div class="modalbg">
<form class="modal form" onsubmit="savePlayer(event)">
<div class="modalhead">
<h3>${editing?'Edit player':'Add player'}</h3>
<button type="button" class="iconbtn" onclick="modal='';render()">✕</button>
</div>

${teams.map(t=>`<option value="${t.id}" ${p.team_id===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}
</select></label>
<label>Position<input id="pposition" value="${esc(p.position||'')}"></label>
<label>Shirt number<input id="pnumber" type="number" min="0" value="${Number(p.shirt_number||0)}"></label>
<label>Avatar image URL<input id="pavatar" type="url" value="${esc(p.avatar_url||'')}" placeholder="https://..."></label>

${[['Goals','pgoals','goals'],['Assists','passists','assists'],['Yellow cards','pyellow','yellow_cards'],['Red cards','pred','red_cards'],['Clean sheets','pclean','clean_sheets']].map(([label,id,key])=>`

<form class="modal form" onsubmit="saveMatch(event)">
<div class="modalhead">
<h3>${editing?'Edit match':'Create match'}</h3>

<label>Home team<select id="home" required>${optTeams(m.home_team_id)}</select></label>

<option value="completed" ${m.status==='completed'?'selected':''}>Completed</option>
<option value="postponed" ${m.status==='postponed'?'selected':''}>Postponed</option>

</div>

<div class="modalactions">
<button type="button" class="btn secondary" onclick="modal='';render()">Cancel</button>

return `<div class="modalbg">
<form class="modal form" onsubmit="saveTeam(event)">
<div class="modalhead">
<h3>${editing?'Edit team':'Add team'}</h3>
<button type="button" class="iconbtn" onclick="modal='';render()">✕</button>
</div>
<label>Team name<input id="tname" required value="${esc(editing?.name||'')}"></label>
<label>Description<textarea id="tdesc" rows="3">${esc(editing?.description||'')}</textarea></label>
<label>Team badge<input id="tlogo" type="file" accept="image/*"></label>
<div class="modalactions">
<button type="button" class="btn secondary" onclick="modal='';render()">Cancel</button>

function optTeams(selected){
return '<option value="">Select team</option>'+teams.map(t=>`<option value="${t.id}" ${selected===t.id?'selected':''}>${esc(t.name)}</option>`).join('');
}

async function saveMatch(e){
e.preventDefault();
let status=document.getElementById('status').value;
let p={
home_team_id:document.getElementById('home').value,
away_team_id:document.getElementById('away').value,
match_date:document.getElementById('date').value,
kick_off:document.getElementById('time').value,
matchweek:+document.getElementById('week').value,
venue:document.getElementById('venue').value,
status,
home_score:status==='completed'?Number(document.getElementById('hs').value):null,
away_score:status==='completed'?Number(document.getElementById('as').value):null
};
if(p.home_team_id===p.away_team_id){
msg('Choose two different teams.',true);
return;
}
let q=editing?db.from('matches').update(p).eq('id',editing.id):db.from('matches').insert(p);
let {error}=await q;
if(error){alert(error.message);return}
modal='';
await load();
}

async function upload(file,bucket){
if(!file)return null;
let path=Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'');
let {error}=await db.storage.from(bucket).upload(path,file);
if(error)throw error;
return db.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

async function saveTeam(e){
e.preventDefault();
try{
let logo_url=editing?.logo_url||null;
let file=document.getElementById('tlogo').files[0];
if(file)logo_url=await upload(file,'team-logos');
let p={
name:document.getElementById('tname').value.trim(),
description:document.getElementById('tdesc').value,
logo_url
};
let q=editing?db.from('teams').update(p).eq('id',editing.id):db.from('teams').insert(p);
let {error}=await q;
if(error)throw error;
modal='';
await load();
}catch(e){alert(e.message)}
}

async function deleteMatch(id){
if(!confirm('Delete this match permanently?'))return;
let {error}=await db.from('matches').delete().eq('id',id);
if(error)alert(error.message);
else load();
}

async function deleteTeam(id){
if(!confirm('Delete this team? It cannot be deleted while used by a match.'))return;
let {error}=await db.from('teams').delete().eq('id',id);
if(error)alert(error.message);
else load();
}

async function saveSettings(e){
e.preventDefault();
try{
let logo_url=settings.logo_url||null;
let file=document.getElementById('leaguefile').files[0];
if(file)logo_url=await upload(file,'league-assets');
let p={
id:1,
league_name:document.getElementById('sname').value,
season:document.getElementById('season').value,
announcement:document.getElementById('announcement').value,
primary_color:document.getElementById('primary').value,
secondary_color:document.getElementById('secondary').value,
logo_url
};
let {error}=await db.from('league_settings').upsert(p);
if(error)throw error;
await load();
msg('Settings saved.');
}catch(e){alert(e.message)}
}

function ensureFlrCredit(){
if(!document.getElementById('flr-credit')){
const f=document.createElement('footer');
f.id='flr-credit';
f.textContent='itsfear made this :)';
f.style.cssText='text-align:center;padding:25px 12px;color:#9b8ca6;font-size:11px;letter-spacing:1px;width:100%;';
root.appendChild(f);
}
}

const flrCreditObserver=new MutationObserver(()=>ensureFlrCredit());
flrCreditObserver.observe(root,{childList:true,subtree:false});

checkSession();

</script>
